<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eff4f8" />
    <title>PayGuard</title>
    <!-- The only thing this page fetches. Every font here has a system
         fallback in the tokens, so offline it renders in those rather than
         waiting on a network that may not be there. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" />
    <script>
      /* index.html's pre-paint block, with the branching taken out: this page
         is only ever Calc20, so the class, the theme attribute and the glass
         variable go on <html> unconditionally. All three have to be there
         before the first paint or the page flashes the default palette —
         styles/calc20.css is scoped under .pg-calc20 and themed by
         data-theme. The preference itself is the shared one, read from the
         same key the full app writes. */
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem('pg-ui-v1') || '{}');
          var theme = ui.theme;
          var dark = theme === 'dark' || ((theme === 'system' || !theme) && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.add('pg-calc20');
          root.classList.toggle('dark', dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          var g = Number((ui.calc20 || {}).glassStrength);
          if (!Number.isFinite(g)) g = 0;
          root.style.setProperty('--glass-strength', String(1 - Math.max(0, Math.min(100, g)) / 100));
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09121f' : '#eff4f8');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/standalone/calc20.tsx"></script>
  </body>
</html>
