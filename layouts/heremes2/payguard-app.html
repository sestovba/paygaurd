<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayGuard — SSDI Income Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500;600&family=Roboto+Slab:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   PAYGUARD — LIGHT THEME
   Design based on "If these two had a baby" crossbreed spec.
   Typography: DM Sans (UI) + DM Mono (numbers) + Roboto Slab (headings)
   ================================================================ */

:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f2f3f5;
  --surface-3: #e9ebef;
  --border: #e3e6ea;
  --border-strong: #c8cccf;

  --text: #1a1c20;
  --text-2: #464b54;
  --muted: #7a828c;
  --dim: #a3a9b0;

  --safe: #0d9488;
  --safe-soft: #ccfbf1;
  --safe-text: #115e59;
  --careful: #d97706;
  --careful-soft: #fef3c7;
  --careful-text: #92400e;
  --over: #dc2626;
  --over-soft: #fee2e2;
  --over-text: #991b1b;

  --brand: #7c3aed;
  --brand-soft: #ede9fe;
  --brand-hover: #6d28d9;
  --brand-text: #ffffff;

  --w2: #2563eb;
  --w2-soft: #dbeafe;
  --1099: #7c3aed;
  --1099-soft: #ede9fe;
  --gig: #b45309;
  --gig-soft: #fef3c7;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  min-height: 100vh;
}

.mono {
  font-family: 'DM Mono', 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3 {
  font-family: 'Roboto Slab', 'DM Sans', serif;
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* ── App shell ── */
#root {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px 100px;
}

/* ── Sticky header ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(246, 247, 249, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
  color: var(--text);
  text-decoration: none;
}

.brand-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), #a78bfa);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.brand-year {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 2px 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  margin-left: 2px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}

/* ── Sections ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px 20px;
  margin-bottom: 12px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 8px;
  flex-wrap: wrap;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 7px;
}

.section-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  display: inline-block;
}

.section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  line-height: 1.3;
  white-space: nowrap;
}

.btn-primary {
  background: var(--brand);
  color: var(--brand-text);
  border-color: var(--brand);
}
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}
.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}

.btn-danger {
  background: var(--over);
  color: white;
  border-color: var(--over);
}
.btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }

.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 5px; }

/* ── Hinge modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26, 28, 32, 0.45);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  backdrop-filter: blur(2px);
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
  transform: translateY(8px);
  transition: transform 0.2s;
  overflow: hidden;
}

.modal-overlay.open .modal-box { transform: translateY(0); }

.modal-header {
  padding: 20px 20px 0;
  text-align: center;
}

.modal-question {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 6px;
}

.modal-sub {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 18px;
}

.modal-body {
  padding: 8px 20px 20px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
}

/* Hinge buttons */
.hinge-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hinge-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
  text-align: left;
  line-height: 1.4;
}

.hinge-btn-working {
  background: var(--brand);
  color: white;
  border-color: var(--brand);
}
.hinge-btn-working:hover { background: var(--brand-hover); border-color: var(--brand-hover); }

.hinge-btn-looking {
  background: transparent;
  color: var(--text);
  border-color: var(--border-strong);
}
.hinge-btn-looking:hover {
  background: var(--surface-2);
  border-color: var(--text-2);
}

.hinge-btn-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hinge-btn-working .hinge-btn-icon {
  background: rgba(255,255,255,0.2);
  color: white;
}

.hinge-btn-looking .hinge-btn-icon {
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
}

/* ── This Month hero ── */
.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 20px 18px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--brand), #a78bfa, var(--safe));
  border-radius: var(--radius) var(--radius) 0 0;
}

.hero-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.hero-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 7px;
}

.hero-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  display: inline-block;
}

.hero-amount {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  font-family: 'DM Mono', monospace;
  color: var(--text);
}

.hero-amount.over { color: var(--over); }
.hero-amount.careful { color: var(--careful); }
.hero-amount.safe { color: var(--safe); }

.hero-sub {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 14px;
  line-height: 1.5;
}

.hero-sub strong {
  color: var(--text);
  font-weight: 600;
}

.hero-job-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 12px;
}

.hero-job-pill .job-name-short {
  font-weight: 600;
  color: var(--text);
}

.hero-job-pill .count-badge {
  font-family: 'DM Mono', monospace;
  font-weight: 600;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
}

.hero-orb {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--brand-soft);
  border: 1px solid var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand);
  flex-shrink: 0;
}

/* ── Orange banner ── */
.orange-banner {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 12px;
  color: #9a3412;
  line-height: 1.5;
}

.orange-banner svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
  color: #ea580c;
}

.orange-banner strong {
  font-weight: 600;
}

/* ── Job cards (Your Income) ── */
.job-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.job-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0;
  margin-bottom: 0;
  transition: border-color 0.15s;
}

.job-card:hover { border-color: var(--border-strong); }

.job-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  cursor: pointer;
  border-radius: var(--radius) var(--radius) 0 0;
}

.job-card-header:hover { background: var(--surface-2); }

.job-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  flex-shrink: 0;
  line-height: 1.4;
}

.job-badge.w2 {
  background: var(--w2-soft);
  color: var(--w2);
}

.job-badge.1099,
.job-badge.gig {
  background: var(--1099-soft);
  color: var(--1099);
}

.job-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.job-name-input {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--brand);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: inherit;
  outline: none;
  min-width: 60px;
}

.job-status-pills {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
}

.status-pill {
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  text-transform: capitalize;
  line-height: 1.4;
}

.status-pill:hover {
  border-color: var(--border-strong);
  color: var(--text);
}

.status-pill.active-ongoing {
  background: var(--safe-soft);
  color: var(--safe-text);
  border-color: var(--safe);
}

.status-pill.active-paused {
  background: var(--careful-soft);
  color: var(--careful-text);
  border-color: var(--careful);
}

.status-pill.active-ended {
  background: var(--over-soft);
  color: var(--over-text);
  border-color: var(--over);
}

.job-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}

.job-counted {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.job-counted-amount {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  letter-spacing: -0.01em;
}

.job-counted-amount.zero { color: var(--dim); }

.job-counted-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.job-meta-row {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--muted);
  padding: 0 14px 11px;
}

.job-meta-row span {
  display: flex;
  align-items: center;
  gap: 3px;
}

.job-meta-row .label {
  color: var(--dim);
}

.job-meta-row .value {
  color: var(--text-2);
  font-family: 'DM Mono', monospace;
  font-weight: 500;
}

.job-actions {
  display: flex;
  gap: 2px;
  padding: 0 14px 11px;
}

.job-action-btn {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
}

.job-action-btn:hover { color: var(--text); background: var(--surface-2); }
.job-action-btn.delete:hover { color: var(--over); background: var(--over-soft); }

.add-job-card {
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  margin-top: 4px;
}

.add-job-card:hover {
  background: var(--surface-3);
  border-color: var(--brand);
  color: var(--text);
}

.add-job-card .plus-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--brand);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ── Ledger (bank-statement style) ── */
.ledger-section {
  padding: 0;
  margin-bottom: 12px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
}

.ledger-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.ledger-head .section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 7px;
}

.ledger-head .section-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--careful);
}

.ledger-hint {
  font-size: 11px;
  color: var(--muted);
}

.ledger-scroll {
  overflow-x: auto;
  padding: 0 2px 2px;
}

.ledger-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 660px;
}

.ledger-table thead th {
  text-align: left;
  padding: 7px 10px;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 2px solid var(--border);
  background: var(--surface-2);
  white-space: nowrap;
}

.ledger-table thead th.right,
.ledger-table tbody td.right {
  text-align: right;
}

.ledger-table thead th.center,
.ledger-table tbody td.center {
  text-align: center;
}

.ledger-table tbody td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  vertical-align: middle;
}

.ledger-table tbody tr:last-child td {
  border-bottom: none;
}

.ledger-table tbody tr:hover td {
  background: var(--surface-2);
}

.ledger-group-header td {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
  border-bottom: 2px solid var(--border);
  padding: 9px 10px;
}

.ledger-group-header .job-name {
  font-size: 14px;
  font-weight: 600;
}

.ledger-group-header .ytd-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  font-weight: 600;
  margin-left: 8px;
}

.ledger-entry-date {
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  font-size: 12px;
}

.ledger-entry-amount {
  font-family: 'DM Mono', monospace;
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
}

.ledger-entry-amount.zero {
  color: var(--dim);
  font-weight: 400;
}

.ledger-entry-amount.over {
  color: var(--over);
}

.ledger-month-total td {
  font-weight: 700;
  color: var(--text);
  border-top: 2px solid var(--border);
  border-bottom: none;
  padding-top: 9px;
  background: var(--surface-2);
}

.ledger-month-total .month-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
}

.ledger-grand-total td {
  background: var(--surface-3);
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  border-top: 2px solid var(--border);
  border-bottom: none;
  padding: 10px;
}

.ledger-grand-total .amount {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
}

.ledger-grand-total.over .amount { color: var(--over); }
.ledger-grand-total.careful .amount { color: var(--careful); }

/* Month columns in ledger */
.month-col {
  text-align: center;
  min-width: 50px;
  width: 50px;
}

.month-col .month-name {
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.month-col .month-value {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-top: 1px;
  line-height: 1.3;
}

.month-col .month-value.zero {
  color: var(--dim);
}

.month-col.current .month-name {
  color: var(--brand);
}

.month-col.current .month-value {
  color: var(--text);
  font-weight: 700;
}

// ── Computed: SGA counted for a job+entry ──
function countedAmount(job, entry) {
  const gross = Number(entry.amount) || 0;
  if (job.type === 'W2') return gross;
  const ded = Number(entry.deductions) || 0;
  return Math.max(0, gross - ded);
}

function jobYTD(job) {
  const t = today();

    .filter(e => e.jobId === job.id && e.year === t.year && e.month <= t.month)
    .reduce((s, e) => s + countedAmount(job, e), 0);

    .filter(e => e.jobId === job.id && e.year === year && e.month === month)
    .reduce((s, e) => s + countedAmount(job, e), 0);
}

// ── Computed: job gross for a given year+month ──
function jobMonthGross(job, year, month) {
  return state.entries
    .filter(e => e.jobId === job.id && e.year === year && e.month === month)
    .reduce((s, e) => s + (Number(e.amount) || 0), 0);
}

// ── Computed: all entries for a job, sorted ──
function jobEntries(job) {
  return state.entries
    .filter(e => e.jobId === job.id)
    .sort((a, b) => (a.year * 100 + a.month) - (b.year * 100 + b.month) || (a.payDate || '').localeCompare(b.payDate || ''));
}

// ── Computed: this month's SGA remaining ──
function thisMonthRemaining(job) {
  const t = today();
  const totalThisMonth = state.entries
    .filter(e => e.year === t.year && e.month === t.month)
    .reduce((s, e) => s + countedAmount(job, e), 0);
  return Math.max(0, SGA_TRIAL - totalThisMonth);
}

// ── Computed: hours remaining at rate ──
function hoursRemaining(job, remaining) {
  if (!job || !job.rate || job.rate <= 0) return null;
  return Math.floor(remaining / job.rate);
}

// ── CRUD: Jobs ──
function addJob(data) {
  const job = {
    id: data.id || uid(),
    name: data.name || 'New Income Source',
    type: data.type || 'W2',
    rate: data.rate || 0,
    status: data.status || 'ongoing',
    createdAt: Date.now()
  };
  state.jobs.unshift(job);
  saveState();
  render();
  toast('"' + job.name + '" added', 'success');
}

function editJob(id, data) {
  const job = state.jobs.find(j => j.id === id);
  if (!job) return;
  if (data.name !== undefined) job.name = data.name || job.name;
  if (data.type !== undefined) job.type = data.type;
  if (data.rate !== undefined) job.rate = Number(data.rate) || 0;
  if (data.status !== undefined) job.status = data.status;
  saveState();
  render();
  toast('Updated', 'success');
}

function deleteJob(id) {
  const job = state.jobs.find(j => j.id === id);
  if (!job) return;
  // Remove all entries for this job too
  state.entries = state.entries.filter(e => e.jobId !== id);
  state.jobs = state.jobs.filter(j => j.id !== id);
  if (expandedJobId === id) expandedJobId = null;
  saveState();
  render();
  toast('"' + job.name + '" removed', 'success');
}

function setJobStatus(id, status) {
  const job = state.jobs.find(j => j.id === id);
  if (!job) return;
  job.status = status;
  saveState();
  render();
}

// ── CRUD: Entries ──
function addEntry(jobId, data) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  const entry = {
    id: uid(),
    jobId: jobId,
    amount: Number(data.amount) || 0,
    hours: Number(data.hours) || 0,
    deductions: Number(data.deductions) || 0,
    notes: data.notes || '',
    payDate: data.payDate || null,
    year: data.year !== undefined ? data.year : today().year,
    month: data.month !== undefined ? data.month : today().month,
    createdAt: Date.now()
  };
  if (data.payDate) {
    const d = parseDateKey(data.payDate);
    if (d) { entry.year = d.year; entry.month = d.month; }
  }
  state.entries.push(entry);
  saveState();
  render();
  toast('Entry added to "' + job.name + '"', 'success');
}

function editEntry(id, data) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  if (data.amount !== undefined) entry.amount = Number(data.amount) || 0;
  if (data.hours !== undefined) entry.hours = Number(data.hours) || 0;
  if (data.deductions !== undefined) entry.deductions = Number(data.deductions) || 0;
  if (data.notes !== undefined) entry.notes = data.notes || '';
  if (data.payDate !== undefined) {
    const d = parseDateKey(data.payDate);
    if (d) { entry.year = d.year; entry.month = d.month; entry.payDate = data.payDate; }
  }
  if (data.year !== undefined) entry.year = data.year;
  if (data.month !== undefined) entry.month = data.month;
  saveState();
  render();
  toast('Entry updated', 'success');
}

function deleteEntry(id) {

  const job = state.jobs.find(j => j.id === entry.jobId);
  state.entries = state.entries.filter(e => e.id !== id);

}

// ── Bank Lines ──
function addBankLine(data) {

    matched: data.matched || null,

}

function deleteBankLine(id) {

function matchBankLine(id, entryId) {

  line.checked = true;
  saveState();

  saveState();
  render();
  toast('Unmatched', 'success');
}

// ── Import bank lines from pasted text ──
function importBankLines(text) {
  const lines = text.split('\n').filter(l => l.trim());
  let count = 0;
  for (const line of lines) {
    // Support: 2026-01-15  Employer Direct Deposit  2800.00
    // And: 01/15/2026  Employer Direct Deposit  2800.00
    // And: 2026-01-15,Employer Direct Deposit,2800.00
    const m = line.match(/^(\d{4}-\d{2}-\d{2})\s+(.+?)\s+\$?(-?[\d,]+\.?\d*)\s*$/i) ||
              line.match(/^(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+\$?(-?[\d,]+\.?\d*)\s*$/i) ||
              line.match(/^(\d{4}-\d{2}-\d{2}),(.+?),(\$?-?[\d,]+\.?\d*)\s*$/i);
    if (!m) continue;
    let d, desc, amt;
    if (m[1].includes('-')) {
      d = m[1];
    } else {
      // mm/dd/yyyy -> yyyy-mm-dd
      const [mm, dd, yy] = m[1].split('/');
      d = yy + '-' + mm + '-' + dd;
    }
    desc = m[2].trim();
    amt = parseFloat(m[3].replace(/,/g, ''));
    if (isNaN(amt) || amt === 0) continue;
    // Avoid exact duplicates
    const dup = state.bankLines.some(l => l.date === d && Math.abs(l.amount - amt) < 0.01 && l.desc === desc);
    if (!dup) {
      state.bankLines.unshift({ id: uid(), date: d, desc, amount: amt, matched: null, checked: false });
      count++;
    }
  }
  if (count > 0) {
    saveState();
    render();
    toast('Imported ' + count + ' line' + (count !== 1 ? 's' : ''), 'success');
  } else {
    toast('No lines parsed — check format', 'error');
  }
}
// ── RENDER: This Month hero ──
function renderHero() {
  if (state.jobs.length === 0) return null;

  const t = today();
  // Find primary job (first ongoing, or first job)
  const primary = state.jobs.find(j => j.status === 'ongoing') || state.jobs[0];
  if (!primary) return null;

  // Compute this month's counted amount across ALL jobs
  const allCountedThisMonth = state.entries
    .filter(e => e.year === t.year && e.month === t.month)
    .reduce((s, e) => {
      const job = state.jobs.find(j => j.id === e.jobId);
      return s + (job ? countedAmount(job, e) : 0);
    }, 0);

  const remaining = Math.max(0, SGA_TRIAL - allCountedThisMonth);
  const over = allCountedThisMonth > SGA_TRIAL;
  const careful = allCountedThisMonth > SGA_TRIAL * 0.85;

  let cls = 'hero-amount';
  if (over) cls += ' over';
  else if (careful) cls += ' careful';
  else cls += ' safe';

  const hoursLeft = hoursRemaining(primary, remaining);

  // Check for extra-paycheck month (month where this job has 2+ entries, or paychecks > 1)
  const entriesThisMonth = state.entries.filter(e => e.year === t.year && e.month === t.month && e.jobId === primary.id);
  const hasExtraPaycheck = primary.paychecks > 1 || entriesThisMonth.length > 1;

  const hero = el('div', { className: 'hero' });

  // Header row
  const head = el('div', { className: 'hero-head' });
  head.appendChild(el('span', { className: 'hero-label' }, [
    el('span', { className: 'dot' }),
    el('span', { text: 'This Month' })
  ]));
  head.appendChild(el('span', { className: 'hero-amount ' + (over ? 'over' : careful ? 'careful' : 'safe'), text: money(allCountedThisMonth) }));
  hero.appendChild(head);

  // Subtext
  const subParts = [];
  subParts.push('of your ' + money(SGA_TRIAL) + ' limit');
  if (hoursLeft !== null && hoursLeft > 0) {
    subParts.push('· about ' + hoursLeft + ' more hours at ' + money(primary.rate) + '/hr');
  } else if (hoursLeft !== null && hoursLeft <= 0) {
    subParts.push('· no hours left at ' + money(primary.rate) + '/hr');
  }
  hero.appendChild(el('div', { className: 'hero-sub', html: subParts.join(' ') }));

  // Primary job pill
  if (primary) {
    const pill = el('div', { className: 'hero-job-pill' });
    pill.appendChild(el('span', { className: 'hero-orb' }, [
      el('svg', { viewBox: '0 0 24 24', width: 16, height: 16, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
        el('path', { d: 'M20 7h-4V5h4V3H7v2H3v2h17V7zM3 17h18v-2H3v2zM12 12v4M10 14h4' })
      ])
    ]));
    pill.appendChild(el('span', { className: 'job-name-short', text: primary.name }));
    const countedThisMonth = state.entries
      .filter(e => e.jobId === primary.id && e.year === t.year && e.month === t.month)
      .reduce((s, e) => s + countedAmount(primary, e), 0);
    pill.appendChild(el('span', { className: 'count-badge', text: money(countedThisMonth) + ' COUNTED' }));
    hero.appendChild(pill);
  }

  // Orange banner for extra paycheck month
  if (hasExtraPaycheck) {
    hero.appendChild(el('div', { className: 'orange-banner' }, [
      el('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
        el('path', { d: 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z' }),
        el('line', { x1: 12, y1: 9, x2: 12, y2: 13 }),
        el('line', { x1: 12, y1: 17, x2: 12.01, y2: 17 })
      ]),
      el('span', { html: '<strong>' + MONTHS_FULL[t.month] + ' pays you an extra time.</strong> That month can go over without you working any differently.' })
    ]));
  }

  return hero;
}

    expandedJobId = expandedJobId === job.id ? null : job.id;
    render();
  }});

  // Badge
  const badgeCls = job.type === 'W2' ? 'w2' : (job.type === '1099' ? '1099' : 'gig');
  header.appendChild(el('span', { className: 'job-badge ' + badgeCls, text: TYPE_LABELS[job.type] || job.type }));

  // Name (or inline edit)
  if (flashingJobId === job.id && isExpanded) {
    const inp = el('input', {
      className: 'job-name-input',
      type: 'text',
      value: job.name,
      autoFocus: true,
      onClick: e => e.stopPropagation(),
      onKeyDown: e => {
        if (e.key === 'Enter') {
          const v = e.target.value.trim();
          if (v) editJob(job.id, { name: v });
          flashingJobId = null;
          render();
        } else if (e.key === 'Escape') {
          flashingJobId = null;
          render();
        }

      onBlur: e => {
        const v = e.target.value.trim();

        render();

    // Entry rows
    entries.forEach(entry => {
      const counted = countedAmount(job, entry);
      const row = el('tr', { className: 'ledger-row-entry' });

      // Edit button cell
      row.appendChild(el('td', { style: { width: 28, textAlign: 'center', padding: '8px 2px' } }, [
        el('div', { className: 'entry-actions' }, [
          el('button', {
            className: 'entry-action-btn',
            onClick: () => openEditEntryModal(entry.id),
            title: 'Edit'
          }, [
            el('svg', { viewBox: '0 0 24 24', width: 11, height: 11, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
              el('path', { d: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7' }),
              el('path', { d: 'M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z' })
            ])
          ]),
          el('button', {
            className: 'entry-action-btn delete',
            onClick: () => deleteEntry(entry.id),
            title: 'Delete'
          }, [
            el('svg', { viewBox: '0 0 24 24', width: 11, height: 11, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
              el('polyline', { points: '3 6 5 6 21 6' }),
              el('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' })
            ])
          ])
        ])
      ]));

      // Date
      row.appendChild(el('td', { className: 'ledger-entry-date', text: entry.payDate || (MONTHS_SHORT[entry.month] + ' ' + entry.year) }));

      // Source
      row.appendChild(el('td', { text: job.name, style: { fontSize: '12px', color: 'var(--text-2)' } }));

      // Hours
      row.appendChild(el('td', { className: 'center mono', text: entry.hours || '—', style: { color: 'var(--muted)' } }));

      // Gross
      row.appendChild(el('td', { className: 'right ledger-entry-amount', text: money(entry.amount) }));

      // Deductions
      row.appendChild(el('td', { className: 'right ledger-entry-amount zero', text: entry.deductions ? money(entry.deductions) : '—' }));

      // SGA Counted
      row.appendChild(el('td', {
        className: 'right ledger-entry-amount' + (counted > SGA_TRIAL ? ' over' : ''),
        text: money(counted)
      }));

      // 12 month columns
      for (let mi = 0; mi < 12; mi++) {
        const isThis = entry.year === currentYear && entry.month === mi;
        const mCls = 'month-col' + (isThis ? ' current' : '');
        const valCls = 'month-value' + (isThis ? '' : ' zero');
        row.appendChild(el('td', {
          className: mCls,
          style: { padding: '8px 2px', textAlign: 'center', verticalAlign: 'middle' }
        }, [
          isThis ? el('span', { className: valCls, style: { fontWeight: 600 }, text: money(entry.amount) }) :
                  el('span', { className: valCls, text: '' })
        ]));
      }

      // Notes
      row.appendChild(el('td', {
        className: 'right',
        text: entry.notes || '',
        style: { fontSize: '11px', color: 'var(--muted)', maxWidth: 90, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }
      }));

      tbody.appendChild(row);
    });

    // Job total row
    const jobTotal = jobYearTotal(job, currentYear);
    const jobGrossTotal = jobEntries(job).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const jobDedTotal = jobEntries(job).reduce((s, e) => s + (Number(e.deductions) || 0), 0);
    grandTotal += jobTotal;

    const jtotal = el('tr', { className: 'ledger-month-total' });
    jtotal.appendChild(el('td', { colSpan: 2 }));
    jtotal.appendChild(el('td', { style: { fontWeight: 600, color: 'var(--text)' } }, [
      el('span', { text: 'Total — ' + job.name })
    ]));
    jtotal.appendChild(el('td', { className: 'center', text: '' }));
    jtotal.appendChild(el('td', { className: 'right ledger-entry-amount', style: { fontWeight: 600 }, text: money(jobGrossTotal) }));
    jtotal.appendChild(el('td', { className: 'right ledger-entry-amount zero', style: { fontWeight: 600 }, text: jobDedTotal ? money(jobDedTotal) : '—' }));
    jtotal.appendChild(el('td', {
      className: 'right ledger-entry-amount' + (jobTotal > SGA_TRIAL ? ' over' : ''),
      style: { fontWeight: 700, fontFamily: "'DM Mono', monospace" },
      text: money(jobTotal)
    }));

    for (let mi = 0; mi < 12; mi++) {
      const mv = jobMonthTotal(job, currentYear, mi);
      monthlyGrandTotals[mi] += mv;
      monthlyGrossTotals[mi] += jobMonthGross(job, currentYear, mi);
      const over = mv > SGA_TRIAL;
      jtotal.appendChild(el('td', {
        className: 'month-col' + (mi === t.month ? ' current' : ''),
        style: { padding: '9px 2px', textAlign: 'center', fontSize: '12px' }
      }, [
        el('span', {
          className: 'month-value' + (mv === 0 ? ' zero' : '') + (over ? ' over' : ''),
          style: { fontWeight: 600 },
          text: mv ? money(mv) : '—'
        })
      ]));
    }

    jtotal.appendChild(el('td', { text: '' }));
    tbody.appendChild(jtotal);
  });

  // Grand total row
  const gtotal = el('tr', {
    className: 'ledger-grand-total' + (grandTotal > SGA_TRIAL ? ' over' : (grandTotal > SGA_TRIAL * 0.85 ? ' careful' : ''))
  });

  // Simplified grand total — just show total counted
  gtotal.appendChild(el('td', { text: '' }));
  gtotal.appendChild(el('td', { text: '' }));
  gtotal.appendChild(el('td', { style: { fontWeight: 700, fontSize: '14px' } }, [
    el('span', { text: 'Total — All Jobs (' + currentYear + ')' })
  ]));
  gtotal.appendChild(el('td', { text: '' }));
  const allGross = state.entries.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const allDed = state.entries.reduce((s, e) => s + (Number(e.deductions) || 0), 0);
  gtotal.appendChild(el('td', {
    className: 'right amount',
    style: { fontFamily: "'DM Mono', monospace", fontSize: '15px', fontWeight: 700 }
  }, [money(allGross)]));
  gtotal.appendChild(el('td', {
    className: 'right amount',
    style: { fontFamily: "'DM Mono', monospace", fontSize: '15px', fontWeight: 700 }
  }, [money(allDed)]));
  gtotal.appendChild(el('td', {
    className: 'right amount',
    style: { fontFamily: "'DM Mono', monospace", fontSize: '15px', fontWeight: 700 },
    text: money(grandTotal)
  }));

  for (let mi = 0; mi < 12; mi++) {
    const mt = monthlyGrandTotals[mi];
    const over = mt > SGA_TRIAL;
    gtotal.appendChild(el('td', {
      className: 'month-col' + (mi === t.month ? ' current' : ''),
      style: { padding: '10px 2px', textAlign: 'center', fontWeight: 700, fontSize: '13px' }
    }, [
      el('span', {
        className: 'month-value' + (mt === 0 ? ' zero' : '') + (over ? ' over' : ''),
        style: { fontSize: '13px' },
        text: mt ? money(mt) : '—'
      })
    ]));
  }

  gtotal.appendChild(el('td', { text: '' }));
  tbody.appendChild(gtotal);

  table.appendChild(tbody);
  scroll.appendChild(table);
  section.appendChild(scroll);

  // Summary line
  const summary = el('div', { style: { padding: '8px 14px', fontSize: '12px', color: 'var(--text-2)', borderTop: '1px solid var(--border)', background: 'var(--surface-2)' } });
  const countedThisYear = state.entries
    .filter(e => e.year === currentYear)
    .reduce((s, e) => {
      const job = state.jobs.find(j => j.id === e.jobId);
      return s + (job ? countedAmount(job, e) : 0);
    }, 0);
  summary.innerHTML = '<strong>Counted in ' + currentYear + '</strong> ' + money(countedThisYear);
  section.appendChild(summary);

  return section;
}

function jobYearTotal(job, year) {
  return state.entries
    .filter(e => e.jobId === job.id && e.year === year)
    .reduce((s, e) => s + countedAmount(job, e), 0);
}
// ── MODAL SYSTEM ──
const modalRoot = $('#modal-root');
let activeModalClose = null;

function openModal(title, bodyEl, footerEl, onClose) {
  modalRoot.innerHTML = '';
  const overlay = el('div', { className: 'modal-overlay', style: { display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'fixed', inset: 0, background: 'rgba(26,28,32,0.45)', zIndex: 100, padding: 20 } });
  overlay.addEventListener('click', e => { if (e.target === overlay && onClose) onClose(); });
  const box = el('div', { className: 'modal-box' });
  if (title) box.appendChild(el('div', { className: 'modal-header' }, [
    el('div', { className: 'modal-question', text: title })
  ]));
  if (bodyEl) box.appendChild(el('div', { className: 'modal-body' }, [bodyEl]));
  if (footerEl) box.appendChild(el('div', { className: 'modal-footer' }, [footerEl]));
  overlay.appendChild(box);
  modalRoot.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  activeModalClose = onClose || null;
  setTimeout(() => {
    const firstInput = box.querySelector('input, select, button');
    if (firstInput) firstInput.focus();
  }, 50);
}

function closeModal() {
  modalRoot.innerHTML = '';
  activeModalClose = null;
}

      const amount = parseFloat($('#bl-amount').value) || 0;

      const d = dateVal.split('-');
      const dateStr = d[0] + '-' + String(d[1]).padStart(2, '0') + '-' + String(d[2]).padStart(2, '0');
      addBankLine({ date: dateStr, desc, amount });
      closeModal();
    }})

  openModal('Add Bank Line', body, footer, () => {
    setTimeout(() => { const i = $('#bl-date'); if (i) i.focus(); }, 50);

}

// ── BANK MATCH MODAL ──
function openBankMatchModal(lineId) {
  const line = state.bankLines.find(l => l.id === lineId);
  if (!line) return;

  // Find candidate entries — same amount, within 1 month
  const lineDate = parseDateKey(line.date);
  let match = null;
  if (lineDate) {
    const cands = state.entries.filter(e => {
      if (Math.abs(e.amount - line.amount) > 0.01) return false;
      const eDate = e.payDate ? parseDateKey(e.payDate) : null;
      if (!eDate) return false;
      const diff = Math.abs((eDate.year * 12 + eDate.month) - (lineDate.year * 12 + lineDate.month));
      return diff <= 1;
    });
    if (cands.length > 0) {
      // Prefer exact month match
      match = cands.find(e => {
        const eDate = e.payDate ? parseDateKey(e.payDate) : null;
        return eDate && eDate.year === lineDate.year && eDate.month === lineDate.month;
      }) || cands[0];
    }
  }

  const body = el('div', { className: 'modal-body' }, [
    el('div', { style: { padding: '10px 12px', background: 'var(--surface-2)', borderRadius: 'var(--radius-xs)', border: '1px solid var(--border)', marginBottom: 12 } }, [
      el('div', { style: { fontSize: '11px', color: 'var(--muted)' }, text: line.date }),
      el('div', { style: { fontWeight: 700, fontFamily: "'DM Mono', monospace", color: line.amount > 0 ? 'var(--safe)' : 'var(--over)', marginTop: 2 }, text: (line.amount > 0 ? '+' : '') + money(line.amount) }),
      el('div', { style: { fontSize: '12px', color: 'var(--text-2)', marginTop: 2 }, text: line.desc })
    ]),
    el('div', { style: { marginBottom: 12 } }, [
      el('label', { className: 'form-label', text: 'Match to entry' }),
      (match ? el('div', { style: { padding: '10px 12px', background: 'var(--safe-soft)', borderRadius: 'var(--radius-xs)', border: '1px solid var(--safe)', marginTop: 4 } }, [
        el('div', { style: { fontWeight: 600 }, text: (state.jobs.find(j => j.id === match.jobId)?.name || 'Unknown') }),
        el('div', { style: { fontSize: '11px', color: 'var(--text-2)', marginTop: 2 }, text: match.payDate || (MONTHS_SHORT[match.month] + ' ' + match.year) }),
        el('div', { style: { fontFamily: "'DM Mono', monospace", fontWeight: 600, marginTop: 2 }, text: money(match.amount) }),
        match.notes ? el('div', { style: { fontSize: '11px', color: 'var(--muted)', marginTop: 2 }, text: match.notes }) : null
      ]) : el('div', { style: { padding: '10px 12px', background: 'var(--over-soft)', borderRadius: 'var(--radius-xs)', border: '1px solid var(--over)', marginTop: 4 } }, [
        el('div', { style: { color: 'var(--over)', fontWeight: 600 }, text: 'No matching entry found' }),
        el('div', { style: { fontSize: '11px', color: 'var(--text-2)', marginTop: 4 }, text: 'Add a PayGuard entry with the same amount in the same or adjacent month.' })
      ]))
    ])
  ]);

  const footer = el('div', { className: 'modal-footer' }, [
    el('button', { className: 'btn btn-ghost', text: 'Close', onClick: closeModal }),
    match ? el('button', { className: 'btn btn-primary', text: 'Confirm Match', onClick: () => {
      matchBankLine(lineId, match.id);
      closeModal();
    }}) : null
  ].filter(Boolean));

  openModal('Match — ' + line.date, body, footer);
}

function renderTwpSection() {
  const section = el('div', { className: 'section' });

  ]));

    openModal('Trial Work Period', el('div', { className: 'modal-body' }, [
      el('p', { style: { color: 'var(--text-2)', lineHeight: 1.6, marginBottom: 8 }, text: 'During your trial work period, you can test your ability to work without losing SSDI benefits. You have 9 service months to use over a 60-month (5-year) period.' }),
      el('p', { style: { color: 'var(--text-2)', lineHeight: 1.6 }, text: 'Once you complete all 9 service months, SSA reviews your earnings. Earnings above ' + money(SGA_SUBSTANTIAL) + '/month may affect your SSDI.' })
    ]), el('div', { className: 'modal-footer' }, [
      el('button', { className: 'btn btn-ghost', text: 'Close', onClick: closeModal })
    ]));
  }}));
  section.appendChild(head);

  // TWP dots
  const dots = el('div', { className: 'twp-dots' });
  const twpUsed = countTwpUsed();
  for (let i = 0; i < TWP_TOTAL; i++) {
    let cls = 'twp-dot';
    if (i < twpUsed) cls += ' used';
    else if (i === twpUsed) cls += ' current';
    else cls += ' future';
    dots.appendChild(el('div', { className: cls, title: 'Service month ' + (i + 1) }));
  }
  section.appendChild(dots);

  // TWP info
  const info = el('div', { className: 'twp-info' }, [
    el('span', { html: '<strong>' + twpUsed + ' of ' + TWP_TOTAL + ' service months used.</strong><br>' +
      'Once you complete 9 service months, SSA reviews your earnings — earnings above <strong>' + money(SGA_SUBSTANTIAL) + '/mo</strong> may affect SSDI.' })
  ]);
  section.appendChild(info);

  return section;
}

function countTwpUsed() {
  const months = new Set();
  state.entries.forEach(e => {
    months.add(e.year + '-' + e.month);
  });
  const sorted = Array.from(months).sort();
  return Math.min(sorted.length, TWP_TOTAL);
}

// ── RENDER: Your Limit ──
function renderLimitSection() {
  const section = el('div', { className: 'section limit-section' });

  // All entries this year, counted
  const t = today();
  const currentYear = t.year;
  const allCountedThisYear = state.entries
    .filter(e => e.year === currentYear)
    .reduce((s, e) => {
      const job = state.jobs.find(j => j.id === e.jobId);
      return s + (job ? countedAmount(job, e) : 0);
    }, 0);

  const remainingThisYear = Math.max(0, SGA_TRIAL * 12 - allCountedThisYear);
  const thisMonthCounted = state.entries
    .filter(e => e.year === currentYear && e.month === t.month)
    .reduce((s, e) => {
      const job = state.jobs.find(j => j.id === e.jobId);
      return s + (job ? countedAmount(job, e) : 0);
    }, 0);
  const remainingThisMonth = Math.max(0, SGA_TRIAL - thisMonthCounted);

  const hoursLeft = hoursRemaining(
    state.jobs.find(j => j.status === 'ongoing') || state.jobs[0],
    remainingThisMonth
  );

  section.appendChild(el('div', { className: 'section-head' }, [
    el('span', { className: 'section-label' }, [
      el('span', { className: 'dot' }),
      el('span', { text: 'Your Limit' })

  section.appendChild(el('div', { className: 'limit-sub', text: 'While you are in your trial work months' }));

  section.appendChild(el('div', { className: 'limit-amount-big', text: money(SGA_TRIAL) + '/month' }));

  const stats = el('div', { className: 'limit-stats' });

  const stat1 = el('div', { className: 'limit-stat' });
  stat1.appendChild(el('div', { className: 'limit-stat-value' + (remainingThisMonth <= 0 ? ' over' : remainingThisMonth < SGA_TRIAL * 0.2 ? ' careful' : ' safe'), text: money(remainingThisMonth) }));
  stat1.appendChild(el('div', { className: 'limit-stat-label', text: 'LEFT THIS MONTH' }));
  stats.appendChild(stat1);

  const stat2 = el('div', { className: 'limit-stat' });
  stat2.appendChild(el('div', { className: 'limit-stat-value brand', text: money(thisMonthCounted) }));
  stat2.appendChild(el('div', { className: 'limit-stat-label', text: 'COUNTED SO FAR' }));
  stats.appendChild(stat2);

  const stat3 = el('div', { className: 'limit-stat' });
  if (hoursLeft !== null) {
    stat3.appendChild(el('div', { className: 'limit-stat-value' + (hoursLeft <= 0 ? ' over' : ' safe'), text: (hoursLeft > 0 ? '~' + hoursLeft : '0') + (hoursLeft !== 1 ? ' hrs' : ' hr') }));

  const stat4 = el('div', { className: 'limit-stat' });

  stat4.appendChild(el('div', { className: 'limit-stat-label', text: currentYear + ' SO FAR' }));
  stats.appendChild(stat4);

  section.appendChild(stats);

  // Notice

    el('span', { html: 'These are planning figures for ' + currentYear + '. Check them with Social Security before you act on any of them.' })
  ]));

  // 2. Your Income
  root.appendChild(renderJobsSection());

  // 3. What You Were Paid (ledger)
  root.appendChild(renderLedgerSection());

  // 4. Your Limit
  root.appendChild(renderLimitSection());

  // 5. Month by Month
  root.appendChild(renderMonthGrid());

  // 6. TWP Tracker
  root.appendChild(renderTwpSection());

  // 7. Bank Reconciliation
  root.appendChild(renderBankSection());

  // Bottom nav
  root.appendChild(renderBottomNav());
}

document.addEventListener('DOMContentLoaded', () => {
  state = loadState();
  state.bankLines = loadBank();
  render();
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  state = loadState();
  state.bankLines = loadBank();
  render();
}
</script>
</body>
</html>
