<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayGuard — SSDI Income Planner</title>
<style>
/* ============================================================
   PHASE 1: LIGHT THEME — CSS ONLY (no body, no JS yet)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500;600&display=swap');

:root {
  /* Page */
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --surface-3: #eef0f3;
  --border: #e2e5ea;
  --border-strong: #c9ced6;

  /* Text */
  --text: #1c1f24;
  --text-2: #4a5058;
  --muted: #7a828c;
  --dim: #a3a9b0;

  /* Semantic */
  --safe: #0d9488;
  --safe-soft: #ccfbf1;
  --safe-text: #115e59;
  --careful: #d97706;
  --careful-soft: #fef3c7;
  --careful-text: #92400e;
  --over: #dc2626;
  --over-soft: #fee2e2;
  --over-text: #991b1b;

  /* Job type colors */
  --w2: #2563eb;
  --w2-soft: #dbeafe;
  --1099: #7c3aed;
  --1099-soft: #ede9fe;

  /* Radius */
  --radius: 12px;
  --radius-sm: 8px;

  /* Brand */
  --brand: #7c3aed;
  --brand-soft: #ede9fe;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body, #root { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  line-height: 1.5;
}

.mono {
  font-family: 'DM Mono', 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

/* ── Page layout ── */
.app-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 20px 120px;
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(244, 245, 247, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--text);
}

.brand-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), #a78bfa);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.brand-year {
  margin-left: 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  padding: 3px 8px;
  background: var(--surface-2);
  border-radius: 999px;
  border: 1px solid var(--border);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}

.icon-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--careful);
  color: white;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Section ── */
section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  line-height: 1;
}

.btn-primary {
  background: var(--brand);
  color: white;
  border-color: var(--brand);
}

.btn-primary:hover {
  background: #6d28d9;
  border-color: #6d28d9;
}

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}

.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

.btn-xs {
  padding: 3px 8px;
  font-size: 11px;
  border-radius: 6px;
}

.btn-danger {
  background: var(--over);
  color: white;
  border-color: var(--over);
}

.btn-danger:hover {
  background: #b91c1c;
  border-color: #b91c1c;
}

.btn-success {
  background: var(--safe);
  color: white;
  border-color: var(--safe);
}

.btn-success:hover {
  background: #0f766e;
  border-color: #0f766e;
}

/* ── SGA Gauge ── */
.gauge-section {
  padding: 20px;
}

.gauge-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
}

.gauge-dial {
  flex: none;
  width: 160px;
  height: 90px;
  position: relative;
}

.gauge-svg {
  width: 100%;
  height: 100%;
}

.gauge-track {
  fill: none;
  stroke: var(--border);
  stroke-width: 8;
  stroke-linecap: round;
}

.gauge-fill {
  fill: none;
  stroke: var(--safe);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dasharray 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s;
}

.gauge-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.gauge-amount {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  line-height: 1;
}

.gauge-amount.over { color: var(--over); }
.gauge-amount.careful { color: var(--careful); }

.gauge-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.gauge-note {
  flex: 1;
  color: var(--text-2);
  font-size: 14px;
  line-height: 1.5;
}

.gauge-note strong {
  color: var(--text);
  font-weight: 600;
}

.gauge-footer {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.gauge-stat {
  text-align: center;
}

.gauge-stat-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-bottom: 2px;
}

.gauge-stat-value {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  font-family: 'DM Mono', monospace;
}

/* ── Add Job Card ── */
.add-job-card {
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.add-job-card:hover {
  background: var(--surface-3);
  border-color: var(--brand);
}

.add-job-text {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
}

.add-job-text svg {
  color: var(--brand);
}

.add-job-shortcut {
  font-size: 11px;
  color: var(--dim);
  font-family: 'DM Mono', monospace;
}

/* ── Job Cards ── */
.job-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}

.job-card:hover {
  border-color: var(--border-strong);
}

.job-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
}

.job-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  flex-shrink: 0;
}

.job-badge.w2 {
  background: var(--w2-soft);
  color: var(--w2);
}

.job-badge.1099,
.job-badge.gig {
  background: var(--1099-soft);
  color: var(--1099);
}

.job-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  min-width: 0;
}

.job-name-input {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--brand);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: inherit;
  outline: none;
  min-width: 100px;
}

.job-status {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

.status-btn {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: capitalize;
}

.status-btn:hover {
  border-color: var(--border-strong);
  color: var(--text);
}

.status-btn.active-ongoing {
  background: var(--safe-soft);
  color: var(--safe-text);
  border-color: var(--safe);
}

.status-btn.active-paused {
  background: var(--careful-soft);
  color: var(--careful-text);
  border-color: var(--careful);
}

.status-btn.active-ended {
  background: var(--over-soft);
  color: var(--over-text);
  border-color: var(--over);
}

.job-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px 12px;
  font-size: 12px;
  color: var(--muted);
}

.job-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.job-meta-item .label {
  color: var(--dim);
}

.job-meta-item .value {
  color: var(--text-2);
  font-family: 'DM Mono', monospace;
  font-weight: 500;
}

.job-actions {
  display: flex;
  gap: 4px;
  padding: 0 16px 12px;
}

.job-edit-btn {
  color: var(--muted);
  padding: 4px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s;
  display: flex;
  align-items: center;
}

.job-edit-btn:hover {
  color: var(--text);
}

.job-delete-btn {
  color: var(--muted);
  padding: 4px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: color 0.15s;
  display: flex;
  align-items: center;
  margin-left: auto;
}

.job-delete-btn:hover {
  color: var(--over);
}

.job-ytd {
  margin-left: auto;
  text-align: right;
}

.job-ytd-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  letter-spacing: -0.01em;
}

.job-ytd-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.job-edit-panel {
  border-top: 1px solid var(--border);
  padding: 14px 16px;
  background: var(--surface-2);
}

.job-edit-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.job-edit-row:last-child {
  margin-bottom: 0;
}

.job-edit-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  min-width: 80px;
}

.job-edit-input {
  flex: 1;
  min-width: 100px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s;
}

.job-edit-input:focus {
  border-color: var(--brand);
}

.job-edit-input.mono {
  font-family: 'DM Mono', monospace;
}

.job-edit-select {
  flex: 1;
  min-width: 100px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  cursor: pointer;
}

.job-edit-select:focus {
  border-color: var(--brand);
}

/* ── Ledger ── */
.ledger-section {
  padding: 0;
  overflow: hidden;
}

.ledger-scroll {
  overflow-x: auto;
  padding: 0 4px 4px;
}

.ledger-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 680px;
}

.ledger-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  background: var(--surface-2);
}

.ledger-table th.right,
.ledger-table td.right {
  text-align: right;
}

.ledger-table th.center,
.ledger-table td.center {
  text-align: center;
}

.ledger-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  vertical-align: middle;
}

.ledger-table tr:last-child td {
  border-bottom: none;
}

.ledger-group-header td {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
  border-bottom: 2px solid var(--border);
  padding: 10px 12px;
}

.ledger-group-header .job-name {
  font-size: 14px;
}

.ledger-row-entry {
  cursor: pointer;
  transition: background 0.1s;
}

.ledger-row-entry:hover {
  background: var(--surface-2);
}

.ledger-entry-date {
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}

.ledger-entry-amount {
  font-family: 'DM Mono', monospace;
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
}

.ledger-entry-amount.zero {
  color: var(--dim);
  font-weight: 400;
}

.ledger-entry-amount.over {
  color: var(--over);
}

.ledger-month-total {
  font-weight: 700;
  color: var(--text) !important;
  font-family: 'DM Mono', monospace;
  border-top: 2px solid var(--border);
  border-bottom: none;
  padding-top: 10px;
}

.ledger-month-total .month-label {
  color: var(--text);
  font-weight: 600;
}

.ledger-grand-total td {
  background: var(--surface-3);
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  border-top: 2px solid var(--border);
  border-bottom: none;
  padding: 12px;
}

.ledger-grand-total .amount {
  font-family: 'DM Mono', monospace;
  font-size: 16px;
}

.ledger-grand-total.over .amount {
  color: var(--over);
}

.ledger-grand-total.careful .amount {
  color: var(--careful);
}

.ledger-actions-cell {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}

.entry-edit-btn,
.entry-delete-btn {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
  color: var(--dim);
}

.entry-edit-btn:hover {
  background: var(--surface-3);
  color: var(--text);
}

.entry-delete-btn:hover {
  background: var(--over-soft);
  color: var(--over);
}

/* ── Month columns in ledger ── */
.month-col {
  text-align: center;
  min-width: 56px;
}

.month-col .month-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.month-col .month-value {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin-top: 2px;
}

.month-col .month-value.zero {
  color: var(--dim);
}

.month-col.current .month-name {
  color: var(--brand);
}

.month-col.current .month-value {
  color: var(--text);
  font-weight: 700;
}

/* ── Active job highlight ── */
.job-card.active {
  border-color: var(--brand);
  box-shadow: 0 0 0 1px var(--brand);
}

.job-card.active .job-badge {
  background: var(--brand);
  color: white;
}

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

.empty-state-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 12px;
  border-radius: 12px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
}

.empty-state-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 4px;
}

.empty-state-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

/* ── TWP Tracker ── */
.twp-dots {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}

.twp-dot {
  flex: 1;
  height: 10px;
  border-radius: 3px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  transition: all 0.2s;
}

.twp-dot.historical {
  background: var(--border-strong);
  border-color: var(--border-strong);
}

.twp-dot.used {
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 0 6px rgba(124, 58, 237, 0.3);
}

.twp-dot.current {
  background: var(--brand-soft);
  border-color: var(--brand);
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.3); }
  50% { box-shadow: 0 0 0 4px rgba(124, 58, 237, 0); }
}

.twp-dot.future {
  background: var(--surface-3);
  border-color: var(--border);
}

.twp-info {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
}

.twp-info strong {
  color: var(--text);
  font-weight: 600;
}

.twp-info .twp-count {
  font-family: 'DM Mono', monospace;
  color: var(--brand);
  font-weight: 700;
}

/* ── SGA Limit Panel ── */
.limit-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.limit-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 4px;
}

.limit-threshold {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 16px;
}

.limit-amount {
  font-size: 36px;
  font-weight: 700;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  letter-spacing: -0.02em;
}

.limit-unit {
  font-size: 13px;
  color: var(--muted);
}

.limit-breakdown {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.limit-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
}

.limit-stat-value {

function gaugeRingSVG(pct, color) {

// ── COUNTED AMOUNT ──
function countedAmount(job, entry) {
  const gross = Number(entry.amount) || 0;
  if (job.type === 'W-2') {
    // W-2 counts in full
    return gross;
  } else if (job.type === '1099') {
    // 1099: deduct mileage reimbursement & disability work expenses if provided
    const deductions = Number(entry.deductions) || 0;
    return Math.max(0, gross - deductions);
  } else {
    // gig: same as 1099
    const deductions = Number(entry.deductions) || 0;
    return Math.max(0, gross - deductions);
  }
}

    planningRate: data.planningRate !== undefined ? Number(data.planningRate) || SGA_TRIAL : SGA_TRIAL,

function derivePayDate(job) {
  // Derive approximate pay date from cycle + anchor day
  if (!job.cycle) return '';
  const d = new Date();
  switch (job.cycle) {
    case 'weekly':
      d.setDate(job.anchorDay || 15);
      break;
    case 'biweekly':
      d.setDate(job.anchorDay || 15);
      break;
    case 'semimonthly':
      d.setDate(Math.min(job.anchorDay || 15, 28));
      break;
    case 'monthly':
    default:
      d.setDate(Math.min(job.anchorDay || 15, 28));
      break;
  }
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// ── COMPUTE JOB TOTALS ──
function jobYTD(job) {
  return state.entries
    .filter(e => e.jobId === job.id && e.year <= todayMonth().year)
    .reduce((s, e) => s + countedAmount(job, e), 0);
}

function jobMonthTotal(job, year, month) {
  return state.entries
    .filter(e => e.jobId === job.id && e.year === year && e.month === month)
    .reduce((s, e) => s + countedAmount(job, e), 0);
}

function jobMonthlyIncome(job, year) {
  const totals = [];
  for (let m = 0; m < 12; m++) totals.push(jobMonthTotal(job, year, m));
  return totals;
}

function jobYearTotal(job, year) {
  return jobMonthlyIncome(job, year).reduce((s, v) => s + v, 0);
}

function addEntry(jobId, data) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  const entry = {
    id: uid(),
    jobId: jobId,
    amount: Number(data.amount) || 0,
    hours: Number(data.hours) || 0,
    deductions: Number(data.deductions) || 0,
    notes: data.notes || '',
    payDate: data.payDate || null,
    year: data.payDate ? parseDate(data.payDate).year : todayMonth().year,
    month: data.payDate ? parseDate(data.payDate).month : todayMonth().month,
    createdAt: Date.now()
  };
  // If payDate string provided, parse year/month from it
  if (data.payDate) {
    const d = parseDate(data.payDate);
    entry.year = d.year;
    entry.month = d.month;
  } else if (data.year !== undefined) {
    entry.year = data.year;
    entry.month = data.month;
  }
  state.entries.push(entry);
  saveState();
  render();
  showToast('Entry added to "' + job.name + '"', 'success');
}

function editEntry(id, data) {

  if (data.amount !== undefined) entry.amount = Number(data.amount) || 0;
  if (data.hours !== undefined) entry.hours = Number(data.hours) || 0;
  if (data.deductions !== undefined) entry.deductions = Number(data.deductions) || 0;

// ── DATE PICKER HELPERS ──
function datePicker({ value, onChange, label }) {
  const parts = value ? value.split('-') : [];
  const y = parts[0] || String(todayMonth().year);
  const m = parts[1] || String(todayMonth().month + 1).padStart(2, '0');
  const input = el('input', {
    type: 'month',
    className: 'modal-input',
    value: y + '-' + m,
    onChange: (e) => {
      const [yy, mm] = e.target.value.split('-');
      const v = { year: parseInt(yy, 10), month: parseInt(mm, 10) - 1 };
      if (onChange) onChange(v);
      return v;
    }
  });
  return el('div', { className: 'form-row' }, [
    label ? el('label', { className: 'modal-label', text: label }) : null,
    input
  ].filter(Boolean));
}

// ── RENDER JOB CARD ──
function renderJobCard(job) {
  const card = el('div', {
    className: 'job-card' + (expandedJobId === job.id ? ' active' : ''),
    id: 'job-' + job.id
  });

  // Header
  const header = el('div', { className: 'job-card-header', onClick: () => {
    expandedJobId = expandedJobId === job.id ? null : job.id;
    flashJobId = job.id;
    render();
  }});
  // Badge
  const badge = el('span', {
    className: 'job-badge ' + (job.type === 'W-2' ? 'w2' : '1099'),
    text: job.type === 'W-2' ? 'W-2' : '1099'
  });
  // Name
  let nameEl;
  if (flashJobId === job.id) {
    // Inline editable during flash
    nameEl = el('input', {
      className: 'job-name-input',
      type: 'text',
      value: job.name,
      autoFocus: true,
      onClick: (e) => e.stopPropagation(),
      onKeyDown: (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          const v = e.target.value.trim();
          if (v) editJob(job.id, { name: v });
          flashJobId = null;
          render();
        } else if (e.key === 'Escape') {
          e.stopPropagation();
          flashJobId = null;
          render();
        }
      },
      onBlur: () => {
        const v = e.target.value.trim();
        if (v && v !== job.name) editJob(job.id, { name: v });
        flashJobId = null;
        render();
      }
    });
    header.appendChild(nameEl);
  } else {
    header.appendChild(el('span', { className: 'job-name', text: job.name }));
  }
  header.appendChild(badge);

  // Status buttons
  const statusGroup = el('div', { className: 'job-status' });
  ['ongoing', 'paused', 'ended'].forEach(s => {
    statusGroup.appendChild(el('button', {
      className: 'status-btn' + (job.status === s ? ' active-' + s : ''),
      onClick: (e) => { e.stopPropagation(); setJobStatus(job.id, s); },
      text: STATUS_TEXT[s],
      title: s === 'ongoing' ? 'Currently working' : (s === 'paused' ? 'Not working right now' : 'Job ended')

  header.appendChild(statusGroup);
  card.appendChild(header);

  // Meta
  const meta = el('div', { className: 'job-meta' });

    el('span', { className: 'label', text: 'Cycle' }),
    el('span', { className: 'value', text: cycleMap[job.cycle] || job.cycle })
  ]));
  // Rate
  meta.appendChild(el('span', { className: 'job-meta-item' }, [
    el('span', { className: 'label', text: 'Rate' }),
    el('span', { className: 'value', text: job.rate ? '$' + job.rate.toFixed(2) + '/hr' : '--' })
  ]));
  // Pay date
  meta.appendChild(el('span', { className: 'job-meta-item' }, [
    el('span', { className: 'label', text: 'Payday' }),
    el('span', { className: 'value', text: job.payDate || '—' })
  ]));
  // YTD
  const ytd = jobYTD(job);
  meta.appendChild(el('span', { className: 'job-ytd' }, [
    el('div', { className: 'job-ytd-value', text: '$' + fmt(ytd) }),
    el('div', { className: 'job-ytd-label', text: 'YTD counted' })

  card.appendChild(meta);

  // Actions
  const actions = el('div', { className: 'job-actions' });
  actions.appendChild(el('button', {
    className: 'btn btn-primary btn-xs',
    text: '+ Add Entry',
    onClick: (e) => { e.stopPropagation(); openAddEntryModal(job.id); }
  }));
  actions.appendChild(el('button', {
    className: 'job-edit-btn',
    title: 'Edit job',
    onClick: (e) => { e.stopPropagation(); openEditJobModal(job.id); }
  }, [
    el('svg', { viewBox: '0 0 24 24', width: 14, height: 14, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
      el('path', { d: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7' }),
      el('path', { d: 'M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z' })
    ])
  ]));
  actions.appendChild(el('button', {
    className: 'job-delete-btn',
    title: 'Delete job',
    onClick: (e) => { e.stopPropagation(); deleteJob(job.id); }
  }, [
    el('svg', { viewBox: '0 0 24 24', width: 14, height: 14, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
      el('polyline', { points: '3 6 5 6 21 6' }),
      el('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' })
    ])

  // Edit panel (if expanded)

function jobDeductionsTotal(job) {
  return state.entries.filter(e => e.jobId === job.id).reduce((s, e) => s + (Number(e.deductions) || 0), 0);
}

  headerRow.appendChild(el('th', { className: 'center', text: 'Hrs' }));

      style: { minWidth: '52px', width: '52px', textAlign: 'center', padding: '8px 2px' }

      el('div', { className: 'month-name', text: mName }),
      el('div', { style: { fontSize: '9px', color: 'var(--muted)', marginTop: 1, fontFamily: "'DM Mono', monospace" }, text: '$' + SGA })
    ]));

  headerRow.appendChild(el('th', { className: 'right', text: 'Notes' }));
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // BODY
  const tbody = el('tbody');

    const jobEntries = state.entries

    groupCell.appendChild(groupInner);
    groupHeader.appendChild(groupCell);
    tbody.appendChild(groupHeader);

    // Entry rows
    jobEntries.forEach(entry => {
      const counted = countedAmount(job, entry);
      const row = el('tr', { className: 'ledger-row-entry' });

      row.appendChild(el('td', { style: { width: '30px', textAlign: 'center', padding: '10px 4px' } }, [

      for (let mi = 0; mi < 12; mi++) {

    // Monthly totals for this job

  // Grand total row
  const grandRow = el('tr', {

// ── TWP DOTS ──
function twpDotClass(i) {
  const used = countTwpUsed();
  const current = todayMonth();
  // Determine if this dot is historical, current, used, or future
  if (i < used) return 'used';
  if (i === used && used < TWP_TOTAL) return 'current';
  return 'future';
}

function countTwpUsed() {
  // Count entries that triggered a TWP service month (one per month with any entry)
  const months = new Set();
  state.entries.forEach(e => {
    months.add(e.year + '-' + e.month);
  });
  // Only count months within TWP window (last 9 months from now or starting point)
  const sorted = Array.from(months).sort();
  // Count the most recent 9 months that have entries
  return Math.min(sorted.length, TWP_TOTAL);
}

  ]));

  const unmatched = bankLines.filter(l => !l.matchedEntryId && l.amount > 0).length;
  const depTotal = bankLines.filter(l => l.amount > 0).reduce((s, l) => s + l.amount, 0);
  const matchedDepTotal = bankLines.filter(l => l.amount > 0 && l.matchedEntryId).reduce((s, l) => s + l.amount, 0);
  const missedDepTotal = depTotal - matchedDepTotal;

  const summary = el('div', { className: 'bank-summary' });
  summary.appendChild(el('span', { className: 'bank-stat matched', text: 'Matched: <strong>' + matched + '</strong>' }));
  summary.appendChild(el('span', { className: 'bank-stat', text: 'Deposits: <strong>' + fmtMoney(depTotal) + '</strong>' }));
  summary.appendChild(el('span', { className: 'bank-stat missed', text: 'Unmatched: <strong>' + unmatched + '</strong> / ' + fmtMoney(missedDepTotal) }));
  head.appendChild(summary);
  section.appendChild(head);

  const importBox = el('div', { className: 'bank-import' });
  const textarea = el('textarea', {
    className: 'bank-import-input',
    placeholder: 'Paste statement lines here — one per row:\n2026-01-15  Employer Direct Deposit  2800.00\n2026-02-15  Employer Direct Deposit  2800.00',
    rows: 3
  });
  importBox.appendChild(textarea);
  const importBtn = el('button', {
    className: 'btn btn-primary btn-sm',
    text: 'Import Lines',
    onClick: () => {
      const lines = textarea.value.split('\n').filter(l => l.trim());
      let count = 0;
      for (const line of lines) {
        // Try formats:
        //  2026-01-15  Description  2800.00
        //  01/15/2026  Description  2800.00
        //  Description,2026-01-15,2800.00
        const m = line.match(/^(\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+\$??([\d,]+\.\d{2})\s*$/i);
        const m2 = line.match(/^([^,]+),\s*(\d{4}-\d{2}-\d{2}),\s*\$?([\d,]+\.\d{2})\s*$/i);
        let dateStr, desc, amount;
        if (m) {
          dateStr = m[1].includes('/') ? m[1].split('/').reverse().join('-') : m[1];
          desc = m[2].trim();
          amount = parseFloat(m[3].replace(/,/g, ''));
        } else if (m2) {
          dateStr = m2[2];
          desc = m2[1].trim();
          amount = parseFloat(m2[3].replace(/,/g, ''));
        } else {
          continue;
        }
        if (!dateStr || isNaN(amount)) continue;
        const [y, mo, d] = dateStr.split('-').map(Number);
        if (!y || !mo || !d) continue;
        // Avoid duplicates by date+amount
        const dup = bankLines.some(l => l.date === dateStr && Math.abs(l.amount - amount) < 0.01);
        if (!dup) {
          bankLines.push({
            id: uid(),
            date: dateStr,
            desc: desc,
            amount: amount,
            matchedEntryId: null,
            viewed: false
          });
          count++;
        }
      }
      saveBankLines();
      render();
      showToast('Imported ' + count + ' line' + (count !== 1 ? 's' : ''), 'success');
      textarea.value = '';
    }
  });
  importBox.appendChild(importBtn);
  importBox.appendChild(el('span', { className: 'bank-hint', text: 'Paste from bank CSV: date, description, amount. Lines with 0.00 are skipped.' }));
  section.appendChild(importBox);

  // Add single line button
  section.appendChild(el('button', {
    className: 'btn btn-ghost btn-sm',
    style: { marginBottom: 12 },
    text: '+ Add a line manually',
    onClick: () => openAddBankLineModal()
  }));

  // Lines table
  if (bankLines.length === 0) {
    const empty = el('div', { className: 'bank-empty' });
    empty.appendChild(el('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
      el('path', { d: 'M3 21h18M5 21V7l8-4 8 4v14M9 21v-6h6v6' })
    ]));
    empty.appendChild(el('div', { style: { fontWeight: 600, marginBottom: 4 }, text: 'No statement lines yet' }));
    empty.appendChild(el('div', { text: 'Paste your bank statement deposits above, or add lines manually. The app will flag deposits that don\'t match any PayGuard entry.' }));
    section.appendChild(empty);
  } else {
    const table = el('table', { className: 'bank-line-table' });
    const thead = el('thead');
    const hrow = el('tr');
    hrow.appendChild(el('th', { style: { width: '90px' }, text: 'Date' }));
    hrow.appendChild(el('th', { text: 'Description' }));
    hrow.appendChild(el('th', { className: 'right', text: 'Amount' }));
    hrow.appendChild(el('th', { className: 'center', text: 'Status' }));
    hrow.appendChild(el('th', { className: 'right', text: 'Actions' }));
    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = el('tbody');
    // Sort by date desc
    const sorted = [...bankLines].sort((a, b) => a.date.localeCompare(b.date));
    sorted.forEach(line => {
      const row = el('tr', {
        className: (line.matchedEntryId ? 'bank-line-matched' : (line.amount > 0 ? 'bank-line-unmatched' : '')) + (line.viewed ? ' bank-line-viewed' : '')
      });
      row.appendChild(el('td', { style: { fontFamily: 'DM Mono, monospace', fontSize: '12px', whiteSpace: 'nowrap' }, text: line.date }));
      row.appendChild(el('td', { text: line.desc, style: { maxWidth: '200px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }));
      const amtCls = line.amount > 0 ? 'bank-line-deposit' : (line.amount < 0 ? 'bank-line-withdrawal' : '');
      row.appendChild(el('td', { className: 'right ' + amtCls, text: (line.amount > 0 ? '+' : '') + fmtMoney(line.amount) }));
      // Status
      const statusCell = el('td', { className: 'center' });
      if (line.matchedEntryId) {
        const e = state.entries.find(en => en.id === line.matchedEntryId);
        statusCell.appendChild(el('span', {
          style: { fontSize: '11px', color: 'var(--safe)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 }
        }, [
          el('svg', { viewBox: '0 0 24 24', width: 12, height: 12, fill: 'none', stroke: 'currentColor', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
            el('path', { d: 'M20 6 9 17l-5-5' })
          ]),
          el('span', { text: e ? (e.jobId ? (state.jobs.find(j => j.id === e.jobId)?.name || 'unknown') : 'entry') : 'matched' })
        ]));
      } else if (line.amount > 0) {
        statusCell.appendChild(el('span', { style: { fontSize: '11px', color: 'var(--careful)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 } }, [
          el('svg', { viewBox: '0 0 24 24', width: 12, height: 12, fill: 'none', stroke: 'currentColor', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
            el('circle', { cx: 12, cy: 12, r: 10 }),
            el('line', { x1: 12, y1: 8, x2: 12, y2: 12 }),
            el('line', { x1: 12, y1: 16, x2: 12.01, y2: 16 })
          ]),
          el('span', { text: 'unmatched' })
        ]));
      } else {
        statusCell.appendChild(el('span', { style: { fontSize: '11px', color: 'var(--muted)' }, text: '—' }));
      }
      row.appendChild(statusCell);

      // Actions
      const actCell = el('td', { className: 'right bank-action-cell' });
      actCell.appendChild(el('button', {
        className: 'btn btn-ghost btn-xs',
        text: 'View',
        onClick: () => { line.viewed = true; saveBankLines(); render(); }
      }));
      if (!line.matchedEntryId || confirm('Unmatch this line?')) {
        if (line.matchedEntryId) {
          actCell.appendChild(el('button', {
            className: 'btn btn-ghost btn-xs',
            text: 'Unmatch',
            onClick: () => {
              line.matchedEntryId = null;
              saveBankLines();
              render();
              showToast('Line unmatched', 'success');
            }
          }));
        }
      }
      if (line.matchedEntryId) {
        actCell.appendChild(el('button', {
          className: 'btn btn-ghost btn-xs',
          text: 'Re-match',
          onClick: () => openMatchModal(line.id)
        }));
      }
      actCell.appendChild(el('button', {
        className: 'entry-delete-btn',
        onClick: () => {
          bankLines = bankLines.filter(l => l.id !== line.id);
          saveBankLines();
          render();
          showToast('Line removed', 'success');
        },
        title: 'Delete line'
      }, [
        el('svg', { viewBox: '0 0 24 24', width: 13, height: 13, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, [
          el('polyline', { points: '3 6 5 6 21 6' }),
          el('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' })
        ])
      ]));
      row.appendChild(actCell);
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    section.appendChild(table);
  }

  root.appendChild(section);
}

        bankLines.push({

  setTimeout(() => { const d = $('#bank-line-date'); if (d) d.focus(); }, 50);
}

// Match a bank line to a PayGuard entry (by date ±3 days and amount match)
function findMatchForLine(line) {
  const lineDate = parseDate(line.date);
  if (!lineDate) return null;
  const candidates = state.entries.filter(e => {
    if (Math.abs(e.amount - line.amount) > 0.01) return false;
    const eDate = parseDate(e.payDate || '');
    if (!eDate) return false;
    const diffDays = Math.abs((lineDate.year * 12 + lineDate.month) - (eDate.year * 12 + eDate.month));
    return diffDays <= 1; // same month or adjacent
  });
  if (candidates.length === 0) return null;
  // Prefer exact date match
  const exact = candidates.find(e => {
    const eDate = parseDate(e.payDate || '');
    return eDate && eDate.year === lineDate.year && eDate.month === lineDate.month;
  });
  return exact || candidates[0];
}

function openMatchModal(lineId) {
  const line = bankLines.find(l => l.id === lineId);
  if (!line) return;
  const match = findMatchForLine(line);
  const body = el('div');
  const fields = [
    el('div', { className: 'form-row' }, [
      el('label', { className: 'modal-label', text: 'Bank line' }),
      el('div', {
        style: {
          padding: '10px 12px',
          background: 'var(--surface-2)',
          borderRadius: '6px',
          border: '1px solid var(--border)',
          marginBottom: 10
        }
      }, [
        el('div', { style: { fontSize: '12px', color: 'var(--muted)' }, text: line.date }),
        el('div', { style: { fontWeight: 600, fontFamily: 'DM Mono, monospace', color: line.amount > 0 ? 'var(--safe)' : 'var(--over)' } }, [
          (line.amount > 0 ? '+' : '') + fmtMoney(line.amount)
        ]),
        el('div', { style: { fontSize: '12px', color: 'var(--text-2)', marginTop: 2 }, text: line.desc })
      ])
    ]),
    el('div', { className: 'form-row' }, [
      el('label', { className: 'modal-label', text: 'Suggested match' }),
      match ? el('div', {
        style: {
          padding: '10px 12px',
          background: 'var(--safe-soft)',
          borderRadius: '6px',
          border: '1px solid var(--safe)',
          marginBottom: 10
        }
      }, [
        el('div', { style: { fontWeight: 600 }, text: (match.jobId ? (state.jobs.find(j => j.id === match.jobId)?.name || 'unknown') : 'Entry') }),
        el('div', { style: { fontSize: '12px', color: 'var(--text-2)', marginTop: 2 }, text: match.payDate || (MONTHS_SHORT[match.month] + ' ' + match.year) }),
        el('div', { style: { fontFamily: 'DM Mono, monospace', fontWeight: 600, marginTop: 2 }, text: fmtMoney(match.amount) }),
        match.notes ? el('div', { style: { fontSize: '11px', color: 'var(--muted)', marginTop: 2 }, text: match.notes }) : null
      ]) : el('div', {
        style: {
          padding: '10px 12px',
          background: 'var(--over-soft)',
          borderRadius: '6px',
          border: '1px solid var(--over)',
          marginBottom: 10
        }
      }, [el('span', { style: { color: 'var(--over)', fontWeight: 600 }, text: 'No matching entry found' }),
          el('div', { style: { fontSize: '11px', color: 'var(--text-2)', marginTop: 4 }, text: 'Add a PayGuard entry with the same amount and a pay date in the same or adjacent month.' })]
      )
    ])
  ];

  const footer = el('div', { className: 'modal-footer' }, [
    el('button', { className: 'btn btn-ghost', text: 'Close', onClick: closeModal }),
    match ? el('button', {
      className: 'btn btn-primary',
      text: 'Confirm Match',
      onClick: () => {
        line.matchedEntryId = match.id;
        line.viewed = true;
        saveBankLines();
        closeModal();
        render();
        showToast('Line matched to entry', 'success');
      }
    }) : null
  ].filter(Boolean));
  openModal('Match — ' + line.date, body, footer);
}

// ── APP INIT ──
function init() {
  // Load from localStorage
  state = loadState();
  // Set default planning rate from first job or SGA
  render();
}
document.addEventListener('DOMContentLoaded', init);
// Also run immediately if DOM already loaded
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  init();
} else {
  document.addEventListener('DOMContentLoaded', init);
}
