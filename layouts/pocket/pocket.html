<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayGuard — Pocket & Layout Comparison Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #17181b;
      color: #e7e8ea;
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 24px 24px 64px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7c8189;
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 4px;
    }
    .desc {
      font-size: 13px;
      color: #9aa0a8;
      max-width: 52ch;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      background: #1f2125;
      color: #c6cad0;
      border: 1px solid #34363b;
    }
    .chip:hover {
      background: #282b30;
      color: #fff;
    }
    .chip.active {
      background: #e7e8ea;
      color: #17181b;
      border-color: #e7e8ea;
      font-weight: 600;
    }
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7c8189;
      margin-bottom: 8px;
    }
    .controls-card {
      background: #1f2125;
      border: 1px solid #282a30;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .stage-container {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pane-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
      padding: 0 4px;
    }
    .pane-title {
      font-size: 13px;
      font-weight: 600;
      color: #c6cad0;
    }
    .pane-dim {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #7c8189;
    }
    .frame-wrapper {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #34363b;
      background: #0e1015;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.7);
      transition: width 0.3s ease, height 0.3s ease;
    }
    iframe {
      display: block;
      border: none;
      transition: width 0.3s ease, height 0.3s ease;
      background: #ffffff;
    }
    .top-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9fe3c0;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .top-nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="top-nav-link">← All Layouts Directory</a>

  <div class="header-row">
    <div>
      <div class="eyebrow">PayGuard · Design Review & Switcher</div>
      <h1 class="title" id="layout-title">Pocket</h1>
      <p class="desc" id="layout-desc">Big text, one action, no chart. Built for a cheap phone on slow data.</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <a id="open-direct" href="#" target="_blank" class="chip" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
        Open Standalone ↗
      </a>
    </div>
  </div>

  <div class="controls-card">
    <div>
      <div class="section-label">Layout</div>
      <div class="btn-group" id="layout-chips"></div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 24px;">
      <div>
        <div class="section-label">Viewport Size</div>
        <div class="btn-group" id="width-chips"></div>
      </div>
      <div>
        <div class="section-label">Mode</div>
        <div class="btn-group" id="mode-chips"></div>
      </div>
    </div>
  </div>

  <div class="stage-container" id="stage">
    <!-- Panes injected here -->
  </div>

  <script>
    const LAYOUTS = [
      { id: 'pocket', label: 'Pocket (Variant)', desc: 'Big text, one action, no chart. Built for a cheap phone on slow data.', url: '../Create Enhanced App Variant/index.html' },
      { id: 'plan', label: 'Plan', desc: 'How many more hours you can work, what a shift would cost you, and which months pay you extra.', url: './plan.html' },
      { id: 'horizon', label: 'Horizon', desc: 'The months you have left, what lands in them, and what to do about it.', url: './horizon.html' },
      { id: 'workrecord', label: 'Work Record', desc: 'The year as a grid, with the months that need you on top.', url: '../ledger/workrecord.html' },
      { id: 'calc20', label: 'Calc20', desc: 'Twelve squares and a running total.', url: '../calc/calc20.html' },
      { id: 'ledger', label: 'Ledger', desc: 'Every month as a row. Fastest for entering amounts.', url: '../ledger/ledger.html' },
      { id: 'payguard', label: 'PayGuard (Cards)', desc: 'Cards you edit in place, with a bar to switch sections.', url: '../ledger/paygaurd.html' },
      { id: 'payguard-latest', label: 'PayGuard (Latest)', desc: 'Latest high-fidelity design layout from Figma Make.', url: '../ledger/paygaurd-latest.html' },
      { id: 'classic', label: 'Classic', desc: 'The month, the year and your jobs, in one scroll.', url: '../sidebar/classic.html' },
      { id: 'v2', label: 'Sidebar (v2)', desc: 'Overview, income and trial-work status as separate pages.', url: '../sidebar/sidebar.html' },
      { id: 'responsive', label: 'Workspace', desc: 'Open a job beside the overview instead of on top of it.', url: '../sidebar/workspace.html' },
      { id: 'improve-css', label: 'Improved CSS', desc: 'Clean streamlined dashboard with sidebar navigation.', url: '../Improve CSS Design/index.html' },
      { id: 'classroom', label: 'Regal Academic', desc: 'Deep emerald ink and gold hairline accents on warm cream paper.', url: '../classroom/index.html' }
    ];

    const WIDTHS = [
      { id: 'phone', label: 'Phone', w: 390, h: 760 },
      { id: 'tablet', label: 'Tablet', w: 768, h: 840 },
      { id: 'desktop', label: 'Desktop', w: 1200, h: 840 }
    ];

    const MODES = [
      { id: 'single', label: 'Preview' },
      { id: 'compare', label: 'Compare (Current vs Polish)' }
    ];

    let currentLayout = LAYOUTS[0];
    let currentWidth = WIDTHS[0];
    let currentMode = MODES[0];

    function renderControls() {
      // Layout chips
      const lContainer = document.getElementById('layout-chips');
      lContainer.innerHTML = '';
      LAYOUTS.forEach(l => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (l.id === currentLayout.id ? ' active' : '');
        btn.textContent = l.label;
        btn.onclick = () => { currentLayout = l; update(); };
        lContainer.appendChild(btn);
      });

      // Width chips
      const wContainer = document.getElementById('width-chips');
      wContainer.innerHTML = '';
      WIDTHS.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (w.id === currentWidth.id ? ' active' : '');
        btn.textContent = w.label + ' (' + w.w + 'px)';
        btn.onclick = () => { currentWidth = w; update(); };
        wContainer.appendChild(btn);
      });

      // Mode chips
      const mContainer = document.getElementById('mode-chips');
      mContainer.innerHTML = '';
      MODES.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (m.id === currentMode.id ? ' active' : '');
        btn.textContent = m.label;
        btn.onclick = () => { currentMode = m; update(); };
        mContainer.appendChild(btn);
      });

      document.getElementById('layout-title').textContent = currentLayout.label;
      document.getElementById('layout-desc').textContent = currentLayout.desc;
      document.getElementById('open-direct').href = currentLayout.url;
    }

    function renderStage() {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';

      if (currentMode.id === 'single') {
        stage.appendChild(createPane(currentLayout.label, currentLayout.url, currentWidth.w, currentWidth.h));
      } else {
        // Compare view
        stage.appendChild(createPane(currentLayout.label + ' (Standard)', currentLayout.url, currentWidth.w, currentWidth.h));
        stage.appendChild(createPane(currentLayout.label + ' (With Polish)', currentLayout.url, currentWidth.w, currentWidth.h, true));
      }
    }

    function createPane(title, url, w, h, applyPolish) {
      const pane = document.createElement('div');
      pane.className = 'pane';

      const header = document.createElement('div');
      header.className = 'pane-header';
      header.style.width = w + 'px';

      const t = document.createElement('span');
      t.className = 'pane-title';
      t.textContent = title;

      const dim = document.createElement('span');
      dim.className = 'pane-dim';
      dim.textContent = w + ' × ' + h + 'px';

      header.appendChild(t);
      header.appendChild(dim);

      const wrapper = document.createElement('div');
      wrapper.className = 'frame-wrapper';
      wrapper.style.width = w + 'px';
      wrapper.style.height = h + 'px';

      const iframe = document.createElement('iframe');
      iframe.style.width = w + 'px';
      iframe.style.height = h + 'px';
      iframe.src = url;

      if (applyPolish) {
        iframe.onload = () => {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (doc && !doc.getElementById('pg-polish-link')) {
              const link = doc.createElement('link');
              link.id = 'pg-polish-link';
              link.rel = 'stylesheet';
              link.href = '../polish.css';
              doc.head.appendChild(link);
            }
          } catch(e) {}
        };
      }

      wrapper.appendChild(iframe);
      pane.appendChild(header);
      pane.appendChild(wrapper);
      return pane;
    }

    function update() {
      renderControls();
      renderStage();
    }

    update();
  </script>
</body>
</html>
