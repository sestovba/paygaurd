const LAYOUTS = [
  ['plan', 'Plan', 'How many more hours you can work, what a shift would cost you, and which months pay you extra.'],
  ['horizon', 'Horizon', 'The months you have left, what lands in them, and what to do about it.'],
  ['pocket', 'Pocket', 'Big text, one action, no chart. Built for a cheap phone on slow data.'],
  ['workrecord', 'Work Record', 'The year as a grid, with the months that need you on top.'],
  ['calc20', 'Calc20', 'Twelve squares and a running total.'],
  ['ledger', 'Ledger', 'Every month as a row. Fastest for entering amounts.'],
  ['payguard', 'PayGuard', 'Cards you edit in place, with a bar to switch sections.'],
  ['classic', 'Classic', 'The month, the year and your jobs, in one scroll.'],
  ['v2', 'Sidebar', 'Overview, income and trial-work status as separate pages.'],
  ['responsive', 'Workspace', 'Open a job beside the overview instead of on top of it.'],
];

const WIDTHS = [
  ['phone', 'Phone', 390, 760],
  ['tablet', 'Tablet', 768, 900],
  ['desktop', 'Desktop', 1280, 860],
];

const CHIP = 'font:inherit;font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;';

class Component extends DCLogic {
  state = {
    layout: this.props.startLayout ?? 'payguard',
    width: this.props.startWidth ?? 'phone',
    mode: this.props.startMode ?? 'compare',
  };
  frames = {};

  chip(active) {
    return CHIP + (active
      ? 'background:#e7e8ea;color:#17181b;border:1px solid #e7e8ea;'
      : 'background:#1f2125;color:#c6cad0;border:1px solid #34363b;');
  }

  seedAndLoad(el, mode) {
    if (!el) return;
    if (window.__pgSeed) window.__pgSeed(this.state.layout);
    el.onload = () => {
      try {
        const doc = el.contentDocument;
        const prev = doc.getElementById('pg-polish-link');
        if (mode === 'after' && !prev) {
          const link = doc.createElement('link');
          link.id = 'pg-polish-link';
          link.rel = 'stylesheet';
          link.href = './polish.css';
          doc.head.appendChild(link);
        } else if (mode !== 'after' && prev) {
          prev.remove();
        }
      } catch (e) {}
    };
    if (mode === 'redesign') {
      if (el.dataset.pgRedesign !== '1') {
        el.dataset.pgRedesign = '1';
        el.src = './PayGuard Redesign.dc.html';
      }
      return;
    }
    let live = false;
    try { live = String(el.contentWindow.location.href).indexOf('app/index.html') > -1; } catch (e) {}
    if (live) el.contentWindow.location.replace('./app/index.html');
    else { el.dataset.pgLoaded = '1'; el.src = './app/index.html'; }
  }

  loadAll() {
    Object.keys(this.frames).forEach(k => this.seedAndLoad(this.frames[k], k));
  }

  set(patch) { this.setState(patch, () => this.loadAll()); }

  renderVals() {
    const { layout, width, mode } = this.state;
    const meta = LAYOUTS.find(l => l[0] === layout) || LAYOUTS[0];
    const w = WIDTHS.find(x => x[0] === width) || WIDTHS[0];

    const paneFor = (key, title) => ({
      key,
      title,
      px: w[2] + '×' + w[3],
      frameStyle: 'width:' + w[2] + 'px;border-radius:14px;overflow:hidden;border:1px solid #34363b;background:#fff;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)',
      iframeStyle: 'display:block;width:' + w[2] + 'px;height:' + w[3] + 'px;border:0',
      ref: el => {
        if (!el) return;
        const fresh = this.frames[key] !== el;
        this.frames[key] = el;
        if (fresh || el.dataset.pgLoaded !== '1') this.seedAndLoad(el, key);
      },
    });

    const TITLES = { before: 'Current build', after: 'With polish', redesign: 'Redesign' };
    const panes = mode === 'compare'
      ? [paneFor('before', TITLES.before), paneFor('after', TITLES.after), paneFor('redesign', TITLES.redesign)]
      : [paneFor(mode, TITLES[mode])];

    return {
      layoutLabel: mode === 'redesign' ? 'Redesign — Runway' : meta[1],
      layoutDesc: mode === 'redesign'
        ? 'One screen: the answer, the runway, the entry. Layout picker does not apply here.'
        : meta[2],
      layouts: LAYOUTS.map(l => ({
        label: l[1],
        style: this.chip(l[0] === layout),
        pick: () => { this.frames = {}; this.set({ layout: l[0] }); },
      })),
      widths: WIDTHS.map(x => ({
        label: x[1],
        style: this.chip(x[0] === width),
        pick: () => this.set({ width: x[0] }),
      })),
      modeLabel: { compare: 'All three', after: 'With polish', before: 'Current build', redesign: 'Redesign' }[mode],
      modeStyle: this.chip(true).replace('border-radius:999px', 'border-radius:8px'),
      toggleMode: () => {
        const order = ['before', 'after', 'redesign', 'compare'];
        const next = order[(order.indexOf(mode) + 1) % order.length];
        this.frames = {};
        this.set({ mode: next });
      },
      reload: () => { this.frames = {}; this.forceUpdate(); },
      panes,
    };
  }
}
